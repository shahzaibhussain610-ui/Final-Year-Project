# ==============================================================================
# Research-Grade Facial Emotion Recognition Pipeline Configuration
# Dataset: FER2013 (Facial Expression Recognition 2013)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Project & Environment Setup
# ------------------------------------------------------------------------------
project:
  name: "fer2013_emotion_recognition"
  description: "Benchmarking EfficientNet-B3, ViT-B/16, ConvNeXt-Tiny, and DDAMFN on FER2013"
  experiment_name: "exp_research_benchmark"
  # Output directories (relative to current working directory or absolute)
  checkpoint_dir: "./checkpoints"
  results_dir: "./results"
  figures_dir: "./results/figures"
  export_dir: "./exported_models"

# ------------------------------------------------------------------------------
# 2. Dataset Settings
# ------------------------------------------------------------------------------
dataset:
  # Path to FER2013 dataset.
  # Replace this placeholder with your local or cloud path, for example:
  # - Local Windows: "D:/FYP/Datasets/Facial Datasets/FER2013"
  # - Google Colab:  "/content/drive/MyDrive/FER2013" or "/content/fer2013"
  # - Kaggle:        "/kaggle/input/challenges-in-representation-learning-facial-expression-recognition-challenge"
  path: "D:/FYP/Datasets/Facial Datasets/FER2013"

  # Format detection:
  # "auto": Automatically detects whether dataset is a CSV file or directory with train/test folders.
  # "csv": Expects a CSV file (e.g. fer2013.csv) with 'pixels' and 'emotion' columns.
  # "image_folder": Expects subdirectories: train/<emotion>/, test/<emotion>/, and optionally val/<emotion>/
  format: "auto"

  # Image specifications
  native_size: 48
  channels: 3               # Pretrained models expect 3-channel RGB; grayscale is duplicated across 3 channels
  interpolation: "bilinear" # "bilinear" or "bicubic"

  # Partitioning strategy:
  # If official splits (Training, PublicTest, PrivateTest) exist in CSV, they are strictly respected.
  # If val folder is absent in image_folder format, a stratified split is generated from train.
  validation_fraction: 0.15
  stratified: true

  # DataLoader options
  num_workers: 0            # 0 for Windows compatibility; set to 2 or 4 on Linux/Colab/Kaggle
  pin_memory: true

# ------------------------------------------------------------------------------
# 3. Emotion Classes & Label Encoding
# ------------------------------------------------------------------------------
classes:
  num_classes: 7
  # Standard FER2013 7-class alphabetical list
  names:
    - "angry"
    - "disgust"
    - "fear"
    - "happy"
    - "sad"
    - "surprise"
    - "neutral"
  # Standard integer mapping for FER2013 CSV format
  csv_id_to_name:
    0: "angry"
    1: "disgust"
    2: "fear"
    3: "happy"
    4: "sad"
    5: "surprise"
    6: "neutral"

# ------------------------------------------------------------------------------
# 4. Reproducibility
# ------------------------------------------------------------------------------
reproducibility:
  seed: 42
  deterministic: true
  benchmark: false

# ------------------------------------------------------------------------------
# 5. Architecture Selection & Hyperparameters
# ------------------------------------------------------------------------------
# Each enabled architecture will undergo identical stratified training and evaluation.
models:
  # Model A: EfficientNet-B3 (Primary Baseline)
  efficientnet_b3:
    enabled: true
    model_type: "cnn"
    pretrained: true
    weights: "DEFAULT"
    input_size: 224
    dropout: 0.3
    batch_size: 32
    freeze_epochs: 3          # Phase 1: Train classifier head only
    finetune_epochs: 15       # Phase 2: Fine-tune entire network
    backbone_lr: 2.0e-5
    head_lr: 2.0e-4
    weight_decay: 0.01

  # Model B: Vision Transformer (ViT-B/16)
  vit_b_16:
    enabled: true
    model_type: "transformer"
    pretrained: true
    weights: "DEFAULT"
    input_size: 224
    dropout: 0.1
    batch_size: 16            # Smaller batch size to accommodate transformer attention memory
    freeze_epochs: 3
    finetune_epochs: 15
    backbone_lr: 1.0e-5
    head_lr: 1.5e-4
    weight_decay: 0.05

  # Model C: ConvNeXt-Tiny (Modernized ConvNet)
  convnext_tiny:
    enabled: true
    model_type: "cnn"
    pretrained: true
    weights: "DEFAULT"
    input_size: 224
    dropout: 0.2
    batch_size: 32
    freeze_epochs: 3
    finetune_epochs: 15
    backbone_lr: 2.0e-5
    head_lr: 2.0e-4
    weight_decay: 0.01

  # Model D: DDAMFN (Dual-Direction Attention Mixed Feature Network)
  # Dedicated facial expression recognition architecture with coordinate/spatial attention.
  # Disabled by default; enable once desired or when comparing custom FER heads.
  ddamfn:
    enabled: false
    model_type: "attention_fer"
    pretrained: false
    input_size: 224
    dropout: 0.2
    batch_size: 32
    freeze_epochs: 2
    finetune_epochs: 15
    backbone_lr: 1.0e-4
    head_lr: 5.0e-4
    weight_decay: 1.0e-4

# ------------------------------------------------------------------------------
# 6. Data Preprocessing & Augmentation
# ------------------------------------------------------------------------------
preprocessing:
  # Standard ImageNet statistics applied to 3-channel representations
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

augmentation:
  enabled: true
  horizontal_flip_prob: 0.5
  rotation_degrees: 10
  translation: [0.06, 0.06]
  color_jitter:
    brightness: 0.15
    contrast: 0.15
    saturation: 0.0
    hue: 0.0
  random_erasing_prob: 0.10     # Mild cutout to simulate facial occlusion without destroying expression

# ------------------------------------------------------------------------------
# 7. Loss Function & Class Balancing
# ------------------------------------------------------------------------------
loss:
  # Options: "cross_entropy", "weighted_ce", "focal_loss", "label_smoothing"
  type: "weighted_ce"
  label_smoothing: 0.05
  focal_gamma: 2.0
  # Data sampler option: "none" or "weighted"
  sampler: "none"

# ------------------------------------------------------------------------------
# 8. Optimization & Regularization
# ------------------------------------------------------------------------------
optimization:
  optimizer: "AdamW"
  mixed_precision: true         # Uses torch.amp.autocast for faster training on CUDA
  grad_clip_norm: 1.0           # Gradient clipping to prevent exploding gradients
  scheduler: "cosine"           # "cosine", "plateau", or "none"
  warmup_epochs: 1
  min_lr: 1.0e-6

early_stopping:
  enabled: true
  patience: 5
  min_delta: 0.001
  monitor_metric: "val_macro_f1" # "val_macro_f1" or "val_accuracy"
  mode: "max"

# ------------------------------------------------------------------------------
# 9. Hyperparameter Search (Optional / Budget-Controlled)
# ------------------------------------------------------------------------------
hyperparameter_search:
  enabled: false                # Set to true to execute budget-controlled trial search
  target_model: "efficientnet_b3"
  n_trials: 4
  epochs_per_trial: 5
  search_space:
    backbone_lr: [1.0e-5, 3.0e-5]
    head_lr: [1.0e-4, 3.0e-4]
    weight_decay: [0.001, 0.01]
    label_smoothing: [0.0, 0.1]

# ------------------------------------------------------------------------------
# 10. Evaluation & Visualizations
# ------------------------------------------------------------------------------
evaluation:
  batch_size: 32
  metrics:
    - "accuracy"
    - "macro_precision"
    - "macro_recall"
    - "macro_f1"
    - "weighted_f1"
    - "per_class_f1"
    - "confusion_matrix"
    - "roc_auc"
  compute_roc_auc: true

# ------------------------------------------------------------------------------
# 11. Generalization & Robustness Testing
# ------------------------------------------------------------------------------
robustness_testing:
  enabled: true
  gaussian_noise_stds: [0.02, 0.05]
  brightness_perturbations: [0.75, 1.25]
  contrast_perturbations: [0.75, 1.25]

external_dataset:
  # Optional: evaluate on an external dataset like RAF-DB or AffectNet if configured
  enabled: false
  name: "RAF-DB"
  path: "PATH_TO_EXTERNAL_DATASET"
  label_mapping: {}

# ------------------------------------------------------------------------------
# 12. Error Analysis & Explainability
# ------------------------------------------------------------------------------
explainability:
  enabled: true
  gradcam_target_model: "efficientnet_b3"
  num_samples_per_class: 2
  save_heatmaps: true

# ------------------------------------------------------------------------------
# 13. Model Export & Inference Benchmarking
# ------------------------------------------------------------------------------
export:
  save_torchscript: true
  save_onnx: true
  onnx_opset: 17
  benchmark_latency: true
  benchmark_iterations: 50
  batch_sizes_to_benchmark: [1, 16]
