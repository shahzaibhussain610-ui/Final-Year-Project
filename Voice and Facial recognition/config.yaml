# ==============================================================================
# MASTER CONFIGURATION: FACIAL EMOTION RECOGNITION (VISUAL ONLY)
# ==============================================================================

environment:
  project_name: "Facial_Emotion_Recognition_Benchmark"
  seed: 42
  device: "cuda"                  # "cuda", "mps", or "cpu"
  mixed_precision: true           # FP16 automatic mixed precision
  num_workers: 0                  # 0 avoids multiprocessing deadlock on Windows
  pin_memory: true
  output_dir: "./outputs"
  checkpoint_dir: "./checkpoints"

taxonomy:
  num_classes: 7
  class_names:
    0: "angry"
    1: "disgust"
    2: "fear"
    3: "happy"
    4: "sad"
    5: "surprise"
    6: "neutral"

datasets:
  data_root: "C:/Users/Shahzaib Hussain/Desktop/Shahzaib Hussain/FYP/Datasets/Facial Dataset"

  fer2013:
    root_dir: "C:/Users/Shahzaib Hussain/Desktop/Shahzaib Hussain/FYP/Datasets/Facial Dataset/FER2013"
    enabled: true

  ck_plus:
    root_dir: "C:/Users/Shahzaib Hussain/Desktop/Shahzaib Hussain/FYP/Datasets/Facial Dataset/CK+"
    enabled: false                # Toggle true to merge CK+ samples

  affectnet_plus:
    root_dir: "C:/Users/Shahzaib Hussain/Desktop/Shahzaib Hussain/FYP/Datasets/Facial Dataset/AffectNet+"
    enabled: false                # Large-scale (414k images). Toggle true for massive pretraining

preprocessing:
  image_size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  augmentation:
    horizontal_flip: 0.5
    rotation_degrees: 15
    color_jitter: [0.2, 0.2, 0.2, 0.1]
    random_erasing: 0.2

architecture:
  # Choose backbone: "ensemble_all", "efficientnet_b2", "resnet50", or "vit_b_16"
  backbone: "ensemble_all"
  
  pretrained_weights:
    load_custom: true
    efficientnet_b2: "C:/Users/Shahzaib Hussain/Desktop/Shahzaib Hussain/FYP/Voice and Facial recognition/best_model efficient_b2.pt"
    vit_b_16: "C:/Users/Shahzaib Hussain/Desktop/Shahzaib Hussain/FYP/Voice and Facial recognition/best_model vit b_16.pt"
    resnet50: "C:/Users/Shahzaib Hussain/Desktop/Shahzaib Hussain/FYP/Voice and Facial recognition/best_model resnet50.pt"

training:
  batch_size: 32
  epochs: 15
  
  optimizer:
    name: "radam"
    lr_backbone: 0.0001
    lr_head: 0.0005
    weight_decay: 0.0001
  
  scheduler:
    type: "cosine"
    t_0: 10
    t_mult: 2
    eta_min: 0.000001

  loss:
    type: "focal_label_smoothing"
    gamma: 2.0
    label_smoothing: 0.1
