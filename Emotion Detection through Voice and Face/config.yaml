# FER2013 experiment configuration.
# Paths use forward slashes so they work in YAML and across Windows/Python APIs.
dataset:
  format: csv                 # csv or imagefolder
  csv_path: "../Datasets/Facial Dataset/FER2013 CSV/fer2013.csv"
  image_root: "../Datasets/Facial Dataset/FER2013"
  train_dir: train
  test_dir: test
  validation_fraction: 0.10
  random_seed: 42
  num_workers: 0              # Windows-friendly default
  pin_memory: true
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]

labels: [angry, disgust, fear, happy, sad, surprise, neutral]

# Recorded dataset locations. This notebook trains only on the configured
# FER2013 source above; the other datasets are not merged into its experiment.
dataset_catalog:
  fer2013_images: "../Datasets/Facial Dataset/FER2013"
  ck_plus: null
  crema_d: "../Datasets/Voice and Facial/CREMA-D"

training:
  loss_function: focal
  focal_gamma: 2.0
  epochs: 30
  patience: 7
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.0001
  label_smoothing: 0.0
  class_weighted_loss: false
  gradient_clip_norm: 1.0
  use_amp: true
  selection_metric: val_macro_f1
  scheduler_factor: 0.5
  scheduler_patience: 2
  augmentation:
    horizontal_flip: true
    rotation_degrees: 10

models:
  vit:
    enabled: true
    architecture: vit_b_16
    pretrained: true
    # Optional local face-expression-pretrained state_dict. If blank, use the
    # configured torchvision ImageNet ViT weights below (no silent substitution).
    face_checkpoint: ""
    imagenet_weights: IMAGENET1K_V1
    input_size: 224
    batch_size: 32
    normalization_mean: [0.485, 0.456, 0.406]
    normalization_std: [0.229, 0.224, 0.225]
  efficientnet_b2:
    enabled: true
    architecture: efficientnet_b2
    pretrained: true
    imagenet_weights: IMAGENET1K_V1
    input_size: 224
    batch_size: 32
    normalization_mean: [0.485, 0.456, 0.406]
    normalization_std: [0.229, 0.224, 0.225]
  resnet50:
    enabled: true
    architecture: resnet50
    pretrained: true
    imagenet_weights: IMAGENET1K_V2
    input_size: 224
    batch_size: 32
    normalization_mean: [0.485, 0.456, 0.406]
    normalization_std: [0.229, 0.224, 0.225]

evaluation:
  benchmark_cpu: true
  latency_warmup: 20
  latency_iterations: 100
  export_torchscript: false
  export_onnx: false
  onnx_opset: 17

run:
  smoke_test: false
  smoke_train_samples: 256
  smoke_validation_samples: 128
  smoke_test_samples: 128
  smoke_epochs: 1

outputs:
  root: "outputs/facial_emotion_experiments"
  resume_run_id: ""           # Set to an existing run ID to resume its checkpoints.
  save_predictions: true
